let current = 0;
let score = {A:0,B:0,C:0,D:0,E:0,F:0};
let ans = Array(questions.length).fill(null);

function startTest(){
  document.getElementById('page-home').style.display='none';
  document.getElementById('page-question').style.display='block';
  renderQ();
}
function renderQ(){
  const q = questions[current];
  document.getElementById('q-text').innerText = q.q;
  document.getElementById('q-index').innerText = `第 ${current+1} / ${questions.length} 题`;
  const wrap = document.getElementById('opt-wrap');
  wrap.innerHTML = '';
  q.o.forEach((it,idx)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerText = it;
    b.onclick = ()=>{
      ans[current] = it[0];
      document.querySelectorAll('.opt').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
    }
    if(ans[current]===it[0]) b.classList.add('active');
    wrap.appendChild(b);
  })
}
function nextQ(){
  if(ans[current]==null){alert("请选择一项！");return;}
  if(current < questions.length-1){
    current++;renderQ();
  }else{calcResult();}
}
function prevQ(){
  if(current>0){current--;renderQ();}
}
function calcResult(){
  score = {A:0,B:0,C:0,D:0,E:0,F:0};
  ans.forEach(k=>score[k]++);
  let maxk = 'A';
  let maxv = 0;
  for(let k in score){if(score[k]>maxv){maxv=score[k];maxk=k;}}
  const r = resultMap[maxk];
  document.getElementById('page-question').style.display='none';
  document.getElementById('page-result').style.display='block';
  document.getElementById('res-name').innerText = r.name;
  document.getElementById('res-text').innerText = r.txt;
}
function restart(){
  current=0;ans=Array(questions.length).fill(null);score={A:0,B:0,C:0,D:0,E:0,F:0};
  document.getElementById('page-result').style.display='none';
  document.getElementById('page-home').style.display='block';
}
</script>
